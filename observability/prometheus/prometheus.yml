global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: []

scrape_configs:
  - job_name: back-stage-backend
    metrics_path: /metrics
    static_configs:
      - targets: ["backend:4000"]
        labels:
          service: back-stage-backend

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
