nameOverride: ""
fullnameOverride: ""

backend:
  replicaCount: 2
  image:
    repository: ghcr.io/back-stage/backend
    tag: latest
    pullPolicy: IfNotPresent
  port: 4000
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80
  probes:
    liveness:
      path: /api/health
      initialDelaySeconds: 10
      periodSeconds: 15
    readiness:
      path: /api/health
      initialDelaySeconds: 5
      periodSeconds: 10

frontend:
  replicaCount: 2
  image:
    repository: ghcr.io/back-stage/frontend
    tag: latest
    pullPolicy: IfNotPresent
  port: 5173
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 256Mi
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 6
    targetCPUUtilizationPercentage: 70

config:
  NODE_ENV: production
  LOG_LEVEL: info
  CORS_ORIGIN: "https://back-stage.example.com"
  RATE_LIMIT_WINDOW_MS: "60000"
  RATE_LIMIT_MAX: "100"
  JWT_EXPIRES_IN: "1h"
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector.observability.svc.cluster.local:4318/v1/traces"

# Os VALORES dos secrets nunca devem ser commitados: preencha via --set,
# um values file separado (nao versionado) ou um Secret externo (ex.: External Secrets Operator).
secret:
  create: true
  name: ""
  data:
    DATABASE_URL: ""
    REDIS_URL: ""
    KAFKA_BROKERS: ""
    JWT_SECRET: ""
    GITHUB_WEBHOOK_SECRET: ""
    GITLAB_WEBHOOK_SECRET: ""

ingress:
  enabled: true
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
  host: back-stage.example.com
  tls:
    enabled: true
    secretName: back-stage-tls

serviceAccount:
  create: true
  name: ""
